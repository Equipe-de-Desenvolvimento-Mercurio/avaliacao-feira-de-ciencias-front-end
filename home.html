<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-straight/css/uicons-regular-straight.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/global.css">
    <title>Área do avaliador</title>
    <script src="js/config.js" defer></script>
    <script src="js/services/service.js" defer></script>
    <script src="js/utils/util.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body class="app-mobile">
    <header class="app-header">
        <div class="icone-feira">
            <i class="fa-solid fa-flask"></i>
        </div>
        <h1 class="feira">Feira de Ciências</h1>
    </header>

    <main>
        <section class="welcome-card avaliador">
            <div class="avatar">
                <i class="fa-solid fa-circle-user"></i>
            </div>
            <div class="ola-avaliador">
                <h2 class="ola">Olá, Avaliador!</h2>
                <p class="avaliador-ofc-sic">Avaliador Oficial · SIC 2026</p>
                <button class="btn-primary-block Ver" type="button">
                    <i class="fa-regular fa-eye"></i>
                    Ver projetos
                </button>
            </div>
        </section>

        <section class="progress-panel">
            <div class="progress-header">
                <div>
                    <h2>Seu progresso</h2>
                    <p class="progress-subtitle">Acompanhamento das avaliações da SIC 2026</p>
                </div>
                <span class="progress-badge porcentagem-progressso">
                    <i class="fi fi-rs-arrow-trend-up"></i>
                    70%
                </span>
            </div>
            <div class="progress-meta">
                <span>Progresso geral</span>
                <span>7 de 10 avaliados</span>
            </div>
            <div class="progress-bar">
                <span style="width: 70%"></span>
            </div>
        </section>

        <section class="stats-grid">
            <article class="stat-card">
                <div class="stat-icon">
                    <i class="fa-regular fa-folder"></i>
                </div>
                <div class="stat-body">
                    <p class="stat-label">Projetos para avaliar</p>
                    <p class="stat-value numero-p-avaliar">10</p>
                </div>
            </article>

            <article class="stat-card">
                <div class="stat-icon">
                    <i class="fa-regular fa-circle-check"></i>
                </div>
                <div class="stat-body">
                    <p class="stat-label">Avaliações realizadas</p>
                    <p class="stat-value numero-realizadas">7</p>
                </div>
            </article>

            <article class="stat-card">
                <div class="stat-icon">
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>
                <div class="stat-body">
                    <p class="stat-label">Avaliações pendentes</p>
                    <p class="stat-value numero-pendente">3</p>
                </div>
            </article>
        </section>
    </main>

    <footer class="app-footer">
        <nav class="footer" aria-label="Navegação principal">
            <button class="footer-item inicio" type="button">
                <i class="fa-solid fa-house"></i>
                Início
            </button>
            <button class="footer-item projetos" type="button">
                <i class="fa-solid fa-folder"></i>
                Projetos
            </button>
            <button class="footer-item avaliaçoes" type="button">
                <i class="fa-solid fa-square-check"></i>
                Avaliações
            </button>
            <button class="footer-item perfil" type="button">
                <i class="fa-solid fa-user"></i>
                Perfil
            </button>
        </nav>
    </footer>
</body>
</html>
