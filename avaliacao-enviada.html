<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/avaliacao-enviada.css">
    <title>Avaliação enviada</title>
  </head>
  <body>
    <main class="confirmacao">
      <div class="marca"><i class="fa-solid fa-flask"></i></div>
      <section class="mensagem" aria-labelledby="titulo-confirmacao">
        <div class="icone-sucesso" aria-hidden="true">
          <i class="fa-solid fa-check"></i>
        </div>
        <p class="etiqueta">SIC 2026</p>
        <h1 id="titulo-confirmacao">Avaliação enviada</h1>
        <p class="descricao">Sua avaliação foi registrada com sucesso. Obrigado por contribuir com a feira de ciências.</p>
        <dl class="resultado-avaliacao" id="resultado-avaliacao" hidden>
          <div><dt>Soma das notas</dt><dd id="soma-notas">-</dd></div>
          <div><dt>Peso aplicado</dt><dd id="peso-avaliacao">-</dd></div>
          <div><dt>Pontuação total</dt><dd id="pontuacao-total">-</dd></div>
        </dl>
        <div class="acoes">
          <a class="botao principal" href="projetos-avaliar.html">Avaliar outro projeto</a>
          <a class="botao secundario" href="home.html">Voltar para Home</a>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var raw = window.sessionStorage.getItem("sic_last_review");
        if (!raw) return;
        try {
          var result = JSON.parse(raw);
          document.getElementById("soma-notas").textContent = result.soma_notas || "-";
          document.getElementById("peso-avaliacao").textContent = result.peso || "-";
          document.getElementById("pontuacao-total").textContent = result.pontuacao_total || "-";
          document.getElementById("resultado-avaliacao").hidden = false;
        } catch (error) {
          window.sessionStorage.removeItem("sic_last_review");
        }
      }());
    </script>
  </body>
</html>
