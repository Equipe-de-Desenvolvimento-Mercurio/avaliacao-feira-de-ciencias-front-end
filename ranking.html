<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <link rel="stylesheet" href="css/ranking.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Poppins">

    <script src="js/config.js" defer></script>
    <script src="js/services/service.js" defer></script>
    <script src="js/utils/util.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <div class="navegador">
        <div class="logo">
            <img src="assets/images/Logo-mercurio.jpg" alt="Logo Mercúrio">
            <div class="texto-logo">
                <h3>Colégio Mercúrio</h3>
                <p>Plataforma Sic</p>
            </div>
        </div>
        <div id="navegador">
            <button class="btn"><i class="fi fi-sr-square-poll-vertical"></i>DashBoard</button>
            <button class="btn"><i class="fi fi-bs-flask"></i>Projetos</button>
            <button class="btn"><i class="fi fi-sr-user"></i>Professores</button>
            <button class="btn"><i class="fi fi-sr-chart-simple"></i>Rank</button>
        </div>
    </div>
    <div class="pagina-principal">
        <header>
            <div class="cabeca">
                <h2>SIC Manegement</h2>
            </div>
            <div class="icon">
                <label class="evento-ranking-label" for="evento-ranking">Evento</label>
                <select id="evento-ranking" aria-label="Selecionar evento do ranking">
                    <option value="">Carregando eventos...</option>
                </select>
                <i class="fi fi-rs-bell"></i>
                <i class="fi fi-rr-settings"></i>
                <div class="perfil"></div>
            </div>
        </header>
        <main>
          <div class="ranking">
            <div class="title">
                <div class="text">
                    <h2>Ranking Final</h2>
                    <p>Ranking dos projetos do evento selecionado.</p>
                    </div>
                    <div class="btn-pdf">
                        <button id="pdf">
                            <i class="fi fi-br-download"></i>
                            Exportar para PDF
                        </button>
                    </div>
                </div>
            <div class="top">
                <div class="card" id="segundo">
                    <div class="top-card">
                        <div class="num">
                                <p></p>
                        </div>
                    </div>
                    <div class="principal">
                        <h1></h1>
                        <p></p>
                        <hr>
                        <div class="pontuacao">
                            <div class="score">
                                <p>Pontuação Final</p>
                                <h4></h4>
                            </div>
                            <div class="avaliacoes">
                                <p>Avaliações</p>
                                <p class="total"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card" id="primeiro">
                    <div class="top-card">
                        <div class="num">
                                <p></p>
                        </div>
                    </div>
                    <div class="principal">
                            <h1></h1>
                            <p></p>
                        <hr>
                        <div class="pontuacao">
                            <div class="score">
                                <p>Pontuação Final</p>
                                    <h4></h4>
                            </div>
                            <div class="avaliacoes">
                                <p>Avaliações</p>
                                    <p class="total"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card" id="terceiro">
                    <div class="top-card">
                        <div class="num">
                                <p></p>
                        </div>
                    </div>
                    <div class="principal">
                            <h1></h1>
                            <p></p>
                        <hr>
                        <div class="pontuacao">
                            <div class="score">
                                <p>Pontuação Final</p>
                                    <h4></h4>
                            </div>
                            <div class="avaliacoes">
                                <p>Avaliações</p>
                                    <p class="total"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="resto">
              <div class="table">
                  <div class="tabela-cabecalho">
                      <p>Posição</p>
                      <p>Projeto</p>
                      <p>Estande</p>
                      <p>Pontuação final</p>
                      <p>Avaliações</p>
                      <p>Status</p>
                  </div>
                  <div class="lista-projetos"></div>
              </div>
            </div>
          </div>
        </main>
    </div>
</body>

</html>
