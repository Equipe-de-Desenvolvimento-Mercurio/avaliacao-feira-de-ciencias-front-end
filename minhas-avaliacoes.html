<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/minhas-avaliacoes.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Minhas avaliacoes</title>
    <script src="js/config.js" defer></script>
    <script src="js/services/service.js" defer></script>
    <script src="js/utils/util.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body class="app-mobile">
    <header class="app-header">
        <div class="icone-feira"><i class="fa-solid fa-flask"></i></div>
        <h1 class="feira">Feira de Ciencias</h1>
    </header>
    <main id="minhas-avaliacoes">
        <div class="texto-inicial">
            <h2>Minhas avaliacoes</h2>
            <p>Consulte as notas que voce registrou nos projetos.</p>
        </div>
        <section class="resumo-avaliacoes" aria-label="Resumo das avaliacoes">
            <div><strong id="minhas-total">0</strong><span>avaliacoes</span></div>
            <div><strong id="minhas-pontuacao">0</strong><span>pontos</span></div>
        </section>
        <div id="minhas-lista" class="minhas-lista">
            <p class="api-empty">Carregando suas avaliacoes...</p>
        </div>
    </main>
    <footer class="app-footer">
        <nav class="footer" aria-label="Navegacao principal">
            <button class="footer-item inicio" type="button"><i class="fa-solid fa-house"></i>Inicio</button>
            <button class="footer-item projetos" type="button"><i class="fa-solid fa-folder"></i>Projetos</button>
            <button class="footer-item avaliaçoes" type="button"><i class="fa-solid fa-square-check"></i>Avaliacoes</button>
            <button class="footer-item perfil" type="button"><i class="fa-solid fa-user"></i>Perfil</button>
        </nav>
    </footer>
</body>
</html>
