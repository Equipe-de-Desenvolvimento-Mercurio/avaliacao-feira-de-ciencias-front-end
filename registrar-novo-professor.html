<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registrar-novo-professor.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css">
    <link rel="shortcut icon" href="assets/images/favicon-mercurio.png" type="image/x-icon">
    <title>Registro Professores</title>
    <script src="js/config.js" defer></script>
    <script src="js/services/service.js" defer></script>
    <script src="js/utils/util.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <div class="navegador">
        <div class="logo">
            <img src="assets/images/Logo-mercurio.jpg" alt="Logo Mercúrio">
            <div class="texto-logo">
                <h3>Colégio Mercúrio</h3>
                <p>Plataforma Sic</p>
            </div>
        </div>
        <div id="navegador">
            <button class="btn"><i class=" fi fi-sr-square-poll-vertical"></i>DashBoard</button>
            <button class="btn"><i class="fi fi-bs-flask"></i>Projetos</button>
            <button class="btn"> <i class="fi fi-sr-user"></i>Professores</button>
            <button class="btn"> <i class="fi fi-sr-chart-simple"></i>Rank</button>
        </div>
    </div>
    <div class="pagina-principal">
        <header>
            <div class="cabeca">
                <h2>SIC Manegement</h2>
            </div>
            <div class="icon">
                <input id="input" placeholder="Buscar..." type="text">
                <i class="fi fi-rs-bell"></i>
                <i class="fi fi-rr-settings"></i>
                <div class="perfil">
                </div>
            </div>
        </header>
        <main>
            <div class="titulo">
                <a href="Pagina-professor.html"> ← Back to professor</a>
                <h1>Registrar Novo Professor</h1>
                <p>Adicionar um novo membro do corpo docente à plataforma.</p>
            </div>

            <div class="box-man">
                <div class="top">
                    <h3>Personal Informação</h3>
                </div>


                <div class="oi">
                    <div class="oie">
                        <label>Nome completo</label>

                        <input id="professor-nome" placeholder="Ex.: Dra. Jane Smith" type="text" required>
                    </div>
                    <div class="oiu">
                        <label>Email completo</label>

                        <input id="professor-email" placeholder="jane.smith@institution.edu" type="email" required>
                    </div>
                </div>



                <div class="subtitulo">
                    <h3>Profissional detalhe</h3>
                </div>




                <div class="eae">
                    <div class="eae-boy">
                        <label for="professor-tipo">Tipo de avaliador *</label>
                        <select id="professor-tipo" required>
                            <option value="">Selecione o tipo de avaliador</option>
                            <option value="tecnico">Técnico</option>
                            <option value="artistico">Artístico</option>
                        </select>
                    </div>
                    <div class="eae-girl">
                        <label for="professor-senha">Senha inicial *</label>
                        <input id="professor-senha" type="password" placeholder="Senha inicial" required>
                    </div>
                </div>
            </div>

            <div class="buttons">
                <button id="registrar-professor" class="btn" type="button">Registrar professor</button>
            </div>

        </main>
</body>

</html>
